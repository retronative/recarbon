# GitHub Pages deployment of the ReCarbon website (website/) to
# https://retronative.github.io/recarbon/ (Settings > Pages > Source: GitHub Actions).
# It runs by hand (Actions > Website > Run workflow); the push trigger is enabled
# once the first deployment has been checked (website/docs/DEPLOY.md).
name: Website

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ['website/**', 'docs/**', 'runtime/**', 'tests/pad_map_test.cpp', 'LICENSES/**', 'NOTICE', 'COPYING', 'THIRD_PARTY_NOTICES.md', '.github/workflows/website.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # Astro 7.4 needs Node 22.23.4 or later
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # The drift check, and the license pages, read ReCarbon's source from the
      # repository root (website/..); --strict makes a missing source fail instead of warn.
      - run: node scripts/gen-controls.mjs --check --strict
      - run: npx astro build
        env:
          SITE_URL: https://retronative.github.io
          BASE_PATH: /recarbon/
      - run: node scripts/check-urls.mjs
        env:
          BASE_PATH: /recarbon/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
