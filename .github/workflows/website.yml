# GitHub Pages deployment of the ReCarbon website (website/) to
# https://retronative.github.io/recarbon/ (Settings > Pages > Source: GitHub Actions).
# It runs on a push to main that changes the site or what it is built from, or by
# hand (Actions > Website > Run workflow).
name: Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['website/**', 'docs/**', 'runtime/**', 'tests/pad_map_test.cpp', 'LICENSES/**', 'NOTICE', 'COPYING', 'THIRD_PARTY_NOTICES.md', '.github/workflows/website.yml']

# Nothing by default; each job asks for what it needs. Actions are pinned to the
# commit of a release (its tag in the comment).
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24   # Astro 7.4 needs Node 22.23.4 or later
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # The drift check, and the license pages, read ReCarbon's source from the
      # repository root (website/..); --strict makes a missing source fail instead of warn.
      - run: node scripts/gen-controls.mjs --check --strict
      - run: npx astro build
        env:
          SITE_URL: https://retronative.github.io
          BASE_PATH: /recarbon/
      - run: node scripts/check-urls.mjs
        env:
          BASE_PATH: /recarbon/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
