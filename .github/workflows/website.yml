# GitHub Pages deployment of the ReCarbon website (website/) to
# https://retronative.github.io/recarbon/ (Settings > Pages > Source: GitHub Actions).
# It runs on a push to main that changes the site or what it is built from, or by
# hand (Actions > Website > Run workflow).
name: Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['website/**', 'docs/**', 'runtime/**', 'tests/pad_map_test.cpp', 'LICENSES/**', 'NOTICE', 'COPYING', 'THIRD_PARTY_NOTICES.md', '.github/workflows/website.yml']

# Nothing by default; each job asks for what it needs. Actions are pinned to the
# commit of a release (its tag in the comment), all on the Node 24 runtime.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24   # Astro 7.4 needs Node 22.23.4 or later
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # The drift check, and the license pages, read ReCarbon's source from the
      # repository root (website/..); --strict makes a missing source fail instead of warn.
      - run: node scripts/gen-controls.mjs --check --strict
      - run: npx astro build
        env:
          SITE_URL: https://retronative.github.io
          BASE_PATH: /recarbon/
      - run: node scripts/check-urls.mjs
        env:
          BASE_PATH: /recarbon/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
