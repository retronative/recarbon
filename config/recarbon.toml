# XenonRecomp config for NFS: Carbon (Xbox 360, USA), title 0x454107EC
# default.xex SHA-256 947f95c7306eabf5bc72972938df57a922798bafbc02edf1a9107f0462c721e1
# Paths are relative to this file. Structure follows SpeedBreaker's config/nfsmw.toml.

[main]
file_path = "../game/files/default.xex"
out_directory_path = "../ppc"
switch_table_file_path = "switch_tables.toml"

# Optimizations stay off until the recompilation runs correctly.
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Found by survey/xexsurvey.cpp byte patterns (one hit each). Same CRT layout
# as MW: restgpr = savegpr + 0x50, vmx_64 = vmx_14 + 0x94.
restgprlr_14_address = 0x8279C1C0
savegprlr_14_address = 0x8279C170
restfpr_14_address = 0x8279C7DC
savefpr_14_address = 0x8279C790
restvmx_14_address = 0x8279E5D8
savevmx_14_address = 0x8279E340
restvmx_64_address = 0x8279E66C
savevmx_64_address = 0x8279E3D4

# longjmp (.pdata fn 0x8279B3B0-0x8279B4C4): r7 = jmp_buf, r6 = value (0 -> 1);
#   restores f14-f31, r13-r31, lr, cr, r1 from the jmp_buf; RtlUnwind path when
#   jmp_buf+312 is set.
# setjmp (leaf, no .pdata): hook check (lis r4,0x8301 / lwz r0,0x5FA4 / bnectr),
#   then mflr/mfcr and stores f14-f31, r13-r31 into r3.
longjmp_address = 0x8279B3B0
setjmp_address = 0x8279D060

invalid_instructions = [
    { data = 0x00000000, size = 4 }, # Padding
    # SEH header before each .pdata function with an exception handler: the
    # __C_specific_handler thunk address, then its scope-table pointer (data,
    # not code). All 72 occurrences of this word are such headers.
    { data = 0x82AAC4F4, size = 8 },
]

